name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-build-package:
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            cibw_build: "*"
            wheel_identifier: linux_x86_64
          - os: "arm-ubuntu-arm-22.04-8core"
            cibw_build: "*"
            wheel_identifier: linux_arm64
          - os: "windows-2022"
            # Revert to windows-latest after: https://github.com/actions/runner-images/issues/7662
            cibw_build: "*"
            wheel_identifier: windows
          - os: "macos-latest"
            cibw_build: "*_x86_64"
            wheel_identifier: macos_x86_64
          - os: "macos-latest"
            cibw_build: "*_arm64"
            wheel_identifier: macos_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Need full history to determine version number.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: "Configure bazel remote cache write credentials"
        env:
          BAZEL_CACHE_SERVICE_ACCOUNT_KEY: ${{ secrets.BAZEL_CACHE_SERVICE_ACCOUNT_KEY }}
        run: python ./tools/ci/configure_bazel_remote_cache.py --bazelrc ~/ci_bazelrc buildwheel-${{ matrix.os }}
        shell: bash # For ~ expansion
      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ runner.os }}-buildwheel-${{ hashFiles('tools/ci/*_requirements.txt', 'third_party/pypa/*_requirements_frozen.txt') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/cibuildwheel_bazel_cache/cache/repos
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-buildwheel-${{ hashFiles('.bazelversion', 'WORKSPACE', 'external.bzl', 'third_party/**') }}
      - name: Install cibuildwheel
        run: pip install -r third_party/pypa/cibuildwheel_requirements_frozen.txt
      - name: Build Python source distribution (sdist)
        run: python -m build --sdist
        if: ${{ runner.os == 'Linux' }}
      - name: Build Python wheels
        run: python ./tools/ci/cibuildwheel.py --bazelrc ~/ci_bazelrc
        shell: bash # For ~ expansion
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-wheels-${{ matrix.wheel_identifier }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  python-publish-package:
    # Only publish package on push to tag or default branch.
    if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - "python-build-package"
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="tensorstore--pypi" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="tensorstore--pypi" \
                  --quiet
          '

      - name: Stage to OSS Exit Gate and upload manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 -m pip install --upgrade pip twine
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/tensorstore--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/tensorstore/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
